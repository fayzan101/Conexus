apiVersion: v1
kind: Service
metadata:
  name: {{ include "eb.name" . }}-api
  labels:
    {{- include "eb.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eb.name" . }}-web
  labels:
    {{- include "eb.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.web.port }}
