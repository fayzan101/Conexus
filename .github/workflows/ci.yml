name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and API tests
        run: pytest -q -m "not integration"
        env:
          AUTH_PROVIDER: dev
          SECRET_KEY: test-secret
          AUTO_MIGRATE: "false"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          EMBEDDING_PROVIDER: hash
          LLM_API_KEY: ""
          ENVIRONMENT: test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eb
          POSTGRES_PASSWORD: eb
          POSTGRES_DB: enterprise_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eb -d enterprise_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Live integration tests
        run: pytest -q -m integration
        env:
          LIVE_INTEGRATION: "1"
          AUTH_PROVIDER: dev
          SECRET_KEY: test-secret
          AUTO_MIGRATE: "false"
          DATABASE_URL: "postgresql+psycopg://eb:eb@localhost:5432/enterprise_brain"
          REDIS_URL: "redis://localhost:6379/0"
          QDRANT_URL: "http://localhost:6333"
          EMBEDDING_PROVIDER: hash
          ENVIRONMENT: test

  appsec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Bandit SAST
        run: bandit -q -r app -x tests -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt || true

  eval-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Phase 8 continuous eval gates
        run: pytest -q tests/unit/test_phase8_ga.py -k "eval_gates_pass or compliance_pack or offline_model"
        env:
          AUTH_PROVIDER: dev
          SECRET_KEY: test-secret
          AUTO_MIGRATE: "false"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          EMBEDDING_PROVIDER: hash
          LLM_API_KEY: ""
          ENVIRONMENT: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
